services:
  - type: web
    name: bonus-monitor-ev
    env: python
    plan: free
    region: frankfurt

    envVars:
      BOT_TOKEN:
        sync: false
      CHAT_ID:
        sync: false
      PYTHON_VERSION: 3.11.9

    buildCommand: "pip install -r requirements.txt"
    startCommand: "python monitor_bonus_auto.py"
